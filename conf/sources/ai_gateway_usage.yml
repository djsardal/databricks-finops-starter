# Source: AI Gateway usage (optional; verified readable, currently 0 rows).
source_id: "ai_gateway_usage"
enabled: true
required: false
source_type: "databricks_system_table"
source_object: "system.ai_gateway.usage"

target:
  schema: "bronze"
  table: "ai_gateway_usage_raw"

ingestion:
  mode: "incremental"
  watermark_column: "event_time"     # verified TIMESTAMP
  watermark_type: "timestamp"
  lookback_hours: 72
  primary_key_columns: ["request_id", "invocation_id"]
  merge_columns: ["request_id", "invocation_id"]
  write_strategy: "merge"
  batch_size: 100000
  schedule_ref: "standard_hourly"

derived_keys:
  source_record_id_column: null
  source_record_id_expression: "concat_ws('|', request_id, invocation_id)"
  event_time_column: "event_time"
  updated_time_column: null

schema:
  contract_ref: "ai_gateway_usage_source"
  additive_columns: "capture_and_review"
  unexpected_type_change: "quarantine_and_alert"
  missing_required_columns: "fail_source"

quality_rules: []

retention:
  bronze_days: 400
  silver_days: 400
