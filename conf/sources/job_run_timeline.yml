# Source: job run timeline (optional; verified readable, currently 0 rows).
source_id: "job_run_timeline"
enabled: true
required: false
source_type: "databricks_system_table"
source_object: "system.lakeflow.job_run_timeline"

target:
  schema: "bronze"
  table: "job_run_timeline_raw"

ingestion:
  mode: "incremental"
  watermark_column: "period_end_time" # verified TIMESTAMP
  watermark_type: "timestamp"
  lookback_hours: 72
  primary_key_columns: ["workspace_id", "job_id", "run_id", "period_start_time"]
  merge_columns: ["workspace_id", "job_id", "run_id", "period_start_time"]
  write_strategy: "merge"
  batch_size: 100000
  schedule_ref: "standard_hourly"

derived_keys:
  source_record_id_column: null
  source_record_id_expression: "concat_ws('|', workspace_id, job_id, run_id, cast(period_start_time as string))"
  event_time_column: "period_start_time"
  updated_time_column: null

schema:
  contract_ref: "job_run_timeline_source"
  additive_columns: "capture_and_review"
  unexpected_type_change: "quarantine_and_alert"
  missing_required_columns: "fail_source"

quality_rules: []

retention:
  bronze_days: 400
  silver_days: 400
